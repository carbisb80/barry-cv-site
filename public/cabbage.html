<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="apple-mobile-web-app-title" content="Cabbage">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cabbage Scorekeeper</title>
<style>
:root{
  --bg:#071525;--panel:#213956;--panel2:#172b43;--line:#4a607a;
  --text:#f6f8fc;--muted:#b7c3d4;--gold:#ffd451;--gold2:#ffe995;--danger:#b94c5d;
  --body-top:#0d2746;--field:#091a2d;--table:#08182766;--head:#294565;
  --sticky:#203955;--foot:#162b44;--card-shadow:#0006
}
body.light{
  --bg:#eef3f8;--panel:#ffffff;--panel2:#f7f9fc;--line:#c8d2df;
  --text:#172234;--muted:#617086;--gold:#c99500;--gold2:#efd15a;--danger:#c85160;
  --body-top:#dfe8f2;--field:#ffffff;--table:#ffffff;--head:#e7edf5;
  --sticky:#f1f5f9;--foot:#e7edf5;--card-shadow:#76869b33
}
body.light button{
  color:#1a2433;
  background:linear-gradient(#f5f7fa,#dfe6ef);
  border-color:#bcc8d6
}
body.light button.primary{
  color:#172234;
  background:linear-gradient(90deg,var(--gold2),#f7df7d)
}
body.light button.danger{
  color:#fff;
  background:linear-gradient(#d96774,#b44756)
}
body.light .modal{
  box-shadow:0 28px 70px rgba(70,85,105,.28)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0,#183c68 0,transparent 35%),linear-gradient(var(--body-top),var(--bg))}
header{text-align:center;padding:34px 16px 18px}
h1{margin:0;font-size:clamp(2rem,5vw,3rem)}
header p,.muted{color:var(--muted)}
main{width:min(1180px,calc(100% - 18px));margin:auto;padding-bottom:45px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 24px 60px var(--card-shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
input,button{font:inherit}
input[type=text]{flex:1;min-width:180px;height:48px;padding:0 14px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:14px}
button{min-height:46px;padding:0 16px;border-radius:14px;border:1px solid #71849b;color:#fff;font-weight:800;background:linear-gradient(#687e9a,#405673)}
button.primary{color:#102038;background:linear-gradient(90deg,var(--gold),var(--gold2));border-color:#ffecad}
button.danger{background:linear-gradient(#c55b6a,#883544)}
button.eye{width:50px;padding:0;font-size:1.35rem}
.hidden{display:none!important}
.player{display:flex;align-items:center;gap:10px;padding:10px;margin-top:10px;border:1px solid #51657e;border-radius:13px;background:#ffffff0b}.player strong{flex:1}
.tablewrap{overflow-x:auto;overflow-y:visible;max-height:none;border:1px solid #51657e;border-radius:17px;-webkit-overflow-scrolling:touch}
table{
  width:100%;min-width:auto;border-collapse:separate;border-spacing:6px;
  background:transparent
}
th,td{
  height:58px;min-width:86px;padding:5px;text-align:center;
  border:0
}
th{
  position:sticky;top:0;z-index:10;background:var(--head);color:var(--muted);
  font-size:.78rem;text-transform:uppercase;border-radius:12px
}
th:first-child,td:first-child{
  position:sticky;left:0;z-index:2;min-width:92px;width:92px;
  text-align:left;font-weight:800;background:var(--sticky)
}
th:first-child{z-index:11}
tbody td:first-child{
  border-radius:12px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 60%,transparent)
}
td.score{
  cursor:pointer;font-weight:900;font-size:1.05rem;padding:0;position:relative;
  overflow:hidden;border-radius:12px;
  background:color-mix(in srgb,var(--panel2) 78%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 62%,transparent)
}
td.score:nth-child(even){
  background:color-mix(in srgb,var(--panel) 78%,transparent)
}
tbody tr:nth-child(even) td.score{
  background:color-mix(in srgb,var(--panel) 74%,transparent)
}
td.score:hover{
  background:color-mix(in srgb,var(--gold) 12%,var(--panel2))
}
td.starter{
  background:color-mix(in srgb,var(--gold) 18%,var(--panel2))!important;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 75%,transparent)
}
td.starter::after{
  content:"🂠";
  position:absolute;
  top:3px;
  right:5px;
  font-size:.9rem;
  line-height:1;
  color:var(--gold);
  filter:drop-shadow(0 0 3px rgba(255,212,81,.35));
}
tfoot td{
  position:sticky;bottom:0;z-index:8;background:var(--foot);font-weight:900;
  overflow:hidden;border-radius:12px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent),0 -3px 8px rgba(0,0,0,.18)
}
tfoot td:first-child{z-index:9;color:var(--gold)}
.total-hidden{color:var(--muted);letter-spacing:.14em}
.total-visible{color:var(--gold);font-size:1.15rem}
.winner-total{background:#ffd451!important;color:#102038!important;box-shadow:inset 0 0 0 2px var(--gold)}

/* Large cell-filling marks */
.mark{
  position:absolute;
  inset:6px;
  display:block;
  border:1px solid rgba(219,231,245,.28);
  border-radius:7px;
}
.mark.cabbage:after,
.mark.full:before,
.mark.full:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:4px;
  height:calc(100% - 8px);
  background:var(--gold);
  border-radius:999px;
  transform-origin:center;
  box-shadow:0 0 8px rgba(255,212,81,.25);
}
.mark.cabbage:after{transform:translate(-50%,-50%) rotate(45deg)}
.mark.full:before{transform:translate(-50%,-50%) rotate(45deg)}
.mark.full:after{transform:translate(-50%,-50%) rotate(-45deg)}

.modalback{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:#000b}
.modal{width:min(450px,100%);padding:18px;border:1px solid #637891;border-radius:24px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 28px 80px #000a;max-height:min(90vh,700px);overflow:auto}
.modal h3{margin:0}
.display{height:68px;margin:14px 0;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:2rem;font-weight:900}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{min-height:57px;font-size:1.2rem}
.special,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.special button,.actions button{min-height:55px}
.settle{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff1c}.settle:last-child{border-bottom:0}
.logo-badge{
  width:72px;height:72px;margin:0 auto 12px;display:grid;place-items:center;
  border-radius:22px;font-size:2.1rem;
  background:linear-gradient(145deg,var(--gold),var(--gold2));
  color:#102038;box-shadow:0 14px 32px rgba(255,212,81,.22)
}
.setup-actions{display:grid;gap:10px;margin-top:18px}
.setup-actions .primary{min-height:56px;font-size:1.05rem}
.recent-names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recent-name-chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--text);font-size:.95rem;min-height:auto}
.recent-name-chip:hover{border-color:var(--gold)}
.recent-name-remove{margin-left:6px;background:transparent;border:0;color:var(--danger);font-weight:700;border-radius:6px;padding:2px 6px;display:none}
.recent-name-wrap.active .recent-name-remove{display:inline-flex}
.saved-games{display:grid;gap:8px;margin-top:12px}
.saved-game-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text)}
.saved-game-item button{min-height:auto;padding:8px 10px;font-size:.9rem}
.saved-game-meta{display:flex;flex-direction:column;gap:2px;font-size:.9rem;color:var(--muted)}
.status-message{min-height:1.2em;margin-top:8px;color:var(--gold);font-weight:700}
@media(max-width:650px){.card{padding:14px;border-radius:20px}header{padding-top:26px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-7HkHphCCnSjprbc8TH4K2GQgJw1oW1mXYhr5ZX2t5HSCl1reWtKm9+/cI2yLR+9SBX5/DzPWWMlX/s8VN/abxQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<header>
<div class="logo-badge">🥬</div>
<h1>Cabbage Scorekeeper</h1>
<p>Tap any score cell to enter the result.</p>
</header>
<main>
<section id="setup" class="card">
<h2>Players</h2>
<div class="row"><input id="name" type="text" placeholder="Player name"><button class="primary" onclick="addPlayer()">Add Player</button></div>
<div id="recentNames" class="recent-names"></div>
<div id="players"></div>

<div style="margin-top:18px">
  <strong>Appearance</strong>
  <div class="row" style="margin-top:10px">
    <button id="darkThemeBtn" type="button" class="primary" onclick="setTheme('dark')">Dark</button>
    <button id="lightThemeBtn" type="button" onclick="setTheme('light')">Light</button>
  </div>
</div>

<p id="error" style="color:#ff9baa;font-weight:800"></p>
<div id="statusMessage" class="status-message"></div>
<div class="setup-actions">
  <button class="primary" onclick="startGame()">Start Game</button>
  <button id="downloadBlankPdfButton" class="primary hidden" type="button" onclick="downloadBlankScoreSheetPDF()">Download Blank Score Sheet</button>
  <button id="resumeButton" class="hidden" onclick="resumeGame()">Resume Saved Game</button>
  <button id="gameScreenButton" type="button" onclick="goToGameScreen()">Game Screen</button>
</div>
</section>

<section id="game" class="hidden">
<section class="card">
<div class="row between">
<div><h2 style="margin:0">Score Table</h2><div class="muted">Gold card marker shows who receives the first of the 8 cards.</div></div>
</div>
<div class="tablewrap" style="margin-top:14px"><table id="table"></table></div>
</section>
<section class="card"><div class="row"><button onclick="undo()">Undo Last Entry</button><button type="button" onclick="goHome()">Home</button><button id="newGameButton" class="danger" type="button" onclick="openNewGameModal()">New Game</button></div></section>
<section id="final" class="card hidden"><h2>Final Result</h2><div id="result"></div><button id="downloadFinalButton" class="primary hidden" type="button" onclick="downloadFinalScore()">Download Final Score PDF</button></section>
</section>
</main>

<!-- Toast that appears above other UI; visible on all screens -->
<div id="toast" class="hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:20px;padding:10px 14px;border-radius:12px;background:var(--gold);color:#102038;font-weight:800;z-index:999;box-shadow:0 8px 18px rgba(0,0,0,.3)"></div>

<div id="back" class="modalback hidden">
<div class="modal">
<h3 id="mtitle">Enter score</h3><div id="msub" class="muted"></div>
<div id="display" class="display">0</div>
<div class="keypad">
<button onclick="digit('1')">1</button><button onclick="digit('2')">2</button><button onclick="digit('3')">3</button>
<button onclick="digit('4')">4</button><button onclick="digit('5')">5</button><button onclick="digit('6')">6</button>
<button onclick="digit('7')">7</button><button onclick="digit('8')">8</button><button onclick="digit('9')">9</button>
<button onclick="clearNum()">Clear</button><button onclick="digit('0')">0</button><button onclick="backspace()">⌫</button>
</div>
<div class="special"><button onclick="special('cabbage')">Cabbage ／</button><button class="primary" onclick="special('full')">Full Run ✕</button></div>
<div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveScore()">Save Score</button></div>
</div>
</div>

<div id="newGameBack" class="modalback hidden">
  <div class="modal">
    <h3>Start a New Game?</h3>
    <div class="muted" style="margin-top:6px">
      Choose whether to keep the current players or return to the opening screen.
    </div>

    <button class="primary" type="button" style="width:100%;margin-top:18px;min-height:55px"
      onclick="newGameSamePlayers()">Same Players</button>

    <button type="button" style="width:100%;margin-top:10px;min-height:55px"
      onclick="newGameNewPlayers()">New Players</button>

    <button type="button" style="width:100%;margin-top:10px"
      onclick="closeNewGameModal()">Cancel</button>
  </div>
</div>

<script>
var rounds=["Ace","2","3","4","5","6","7","8","9","10","Jack","Queen","King"];
var game={players:[],entries:{},history:[],started:false,showTotals:false,theme:"light",startPlayer:0};
var modal={playerId:null,round:null,value:"0"};
function id(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function applyTheme(){
  document.body.classList.toggle("light",game.theme==="light");
  var dark=document.getElementById("darkThemeBtn");
  var light=document.getElementById("lightThemeBtn");
  if(dark&&light){
    dark.classList.toggle("primary",game.theme==="dark");
    light.classList.toggle("primary",game.theme==="light");
  }
}
function setTheme(theme){
  game.theme=theme;
  applyTheme();
  save();
}
function goToGameScreen(){
  var button=document.getElementById('gameScreenButton');
  if(button && button.disabled) return;
  var saved=null;
  var hasSaved=false;
  try{
    saved=localStorage.getItem('cabbageTableCurrent');
    if(saved){
      var parsed=JSON.parse(saved);
      hasSaved=!!(parsed && parsed.started);
    }
  }catch(e){
    console.warn('Could not read saved game for Game Screen', e);
  }
  if(game && game.started && game.players && game.players.length){
    if(hasSaved){
      try{game=JSON.parse(saved)}catch(e){console.warn('Could not restore saved game for Game Screen', e)}
    }
    if(!game.theme) game.theme='light';
    applyTheme();
    showGame();
    renderSavedGames();
    setStatus('Game screen opened.');
    setTimeout(clearStatus, 1600);
  } else if(hasSaved){
    resumeGame();
  } else {
    document.getElementById('setup').classList.remove('hidden');
    document.getElementById('game').classList.add('hidden');
  }
}
function goHome(){
  // Return to the setup screen, preserving the current game state.
  document.getElementById('game').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  updateResumeButton();
  updateGameScreenButton();
  renderPlayers();
}
function getPreviousNameKey(){
  return "cabbagePreviousNames";
}
function setStatus(message){
  var box=document.getElementById("statusMessage");
  if(!box) return;
  box.textContent=message;
  try{
    var t=document.getElementById('toast');
    if(t){
      if(message&&message.length){
        t.textContent=message; t.classList.remove('hidden');
      } else {
        t.classList.add('hidden');
      }
    }
  }catch(e){}
}
function clearStatus(){
  setStatus("");
}
function loadPreviousNames(){
  var stored=null;
  try{stored=localStorage.getItem(getPreviousNameKey())}catch(e){}
  var list=[];
  if(stored){
    try{list=JSON.parse(stored)||[]}catch(e){list=[];}
  }
  var container=document.getElementById("recentNames");
  if(!container) return;
  container.innerHTML="";
  if(!list.length) return;
  list.forEach(function(name){
    var wrap=document.createElement('div');
    wrap.className='recent-name-wrap';
    wrap.style.display='inline-flex'; wrap.style.alignItems='center'; wrap.style.gap='6px';

    var chip=document.createElement("button");
    chip.type="button";
    chip.className="recent-name-chip";
    chip.textContent=name;
    chip.addEventListener("click", function(){usePreviousName(name)});

    var clearBtn=document.createElement('button');
    clearBtn.type='button'; clearBtn.className='recent-name-remove'; clearBtn.textContent='Delete';
    clearBtn.title='Remove from recent names';
    clearBtn.addEventListener('click', function(e){ e.stopPropagation(); removePreviousName(name); });

    var longPressTimer=null;
    wrap.addEventListener('mousedown', function(){
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(function(){wrap.classList.add('active');}, 500);
    });
    wrap.addEventListener('mouseup', function(){clearTimeout(longPressTimer);});
    wrap.addEventListener('mouseleave', function(){clearTimeout(longPressTimer);});
    wrap.addEventListener('touchstart', function(e){
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(function(){wrap.classList.add('active');}, 500);
    }, {passive:true});
    wrap.addEventListener('touchend', function(){clearTimeout(longPressTimer);});
    wrap.addEventListener('contextmenu', function(e){
      e.preventDefault();
      wrap.classList.add('active');
    });

    wrap.appendChild(chip);
    wrap.appendChild(clearBtn);
    container.appendChild(wrap);
  });
}

function removePreviousName(name){
  if(!name) return;
  var key=getPreviousNameKey();
  try{
    var stored=localStorage.getItem(key);
    var list=stored?JSON.parse(stored)||[]:[];
    var filtered=list.filter(function(n){return n!==name});
    localStorage.setItem(key,JSON.stringify(filtered));
  }catch(e){console.warn('Could not remove previous name',e)}
  loadPreviousNames();
}
function renderSavedGames(){
  var container=document.getElementById("savedGames");
  if(!container) return;
  var stored=null;
  try{stored=localStorage.getItem("cabbageTableCurrent")}catch(e){}
  container.innerHTML = "";
  if(!stored) return;
  try{
    var saved=JSON.parse(stored);
    if(!saved||!saved.startedAt) return;
    var label = saved.startedAt ? new Date(saved.startedAt).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}) : "Saved game";
    var item = document.createElement('div');
    item.className = 'saved-game-item';

    var meta = document.createElement('div');
    meta.className = 'saved-game-meta';
    var title = document.createElement('strong'); title.textContent = 'Saved game';
    var span = document.createElement('span'); span.textContent = label;
    meta.appendChild(title); meta.appendChild(span);

    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'primary'; btn.textContent = 'Load';
    btn.addEventListener('click', function(){
      console.debug && console.debug('cabbage: saved load button clicked');
      resumeGame();
    });

    item.appendChild(meta);
    item.appendChild(btn);
    container.appendChild(item);
  updateSavedGameIndicator();
  }catch(e){
    container.innerHTML = "";
    console.error(e);
  }
}
function usePreviousName(name){
  var input=document.getElementById("name");
  if(!input) return;
  input.value=name;
  input.focus();
}
function savePreviousName(name){
  if(!name) return;
  var key=getPreviousNameKey();
  var stored=null;
  try{stored=localStorage.getItem(key)}catch(e){}
  var list=[];
  if(stored){
    try{list=JSON.parse(stored)||[]}catch(e){list=[];}
  }
  name=name.trim();
  if(!name) return;
  if(list.some(function(n){return n.toLowerCase()===name.toLowerCase()})) return;
  list.unshift(name);
  if(list.length>20) list.length=20;
  try{localStorage.setItem(key,JSON.stringify(list))}catch(e){}
  loadPreviousNames();
}
function resetGameForRosterChange(){
  clearSavedGames();
  game.entries={};
  game.history=[];
  game.started=false;
  game.showTotals=false;
  document.getElementById('game').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('final').classList.add('hidden');
  document.getElementById('table').innerHTML='';
  document.getElementById('result').innerHTML='';
  updateResumeButton();
  updateGameScreenButton();
}
function addPlayer(){var i=document.getElementById("name"),n=i.value.trim(),e=document.getElementById("error");e.textContent="";if(!n){e.textContent="Enter a player name.";return}if(game.players.some(function(p){return p.name.toLowerCase()===n.toLowerCase()})){e.textContent="That player already exists.";return}game.players.push({id:id(),name:n});savePreviousName(n);i.value="";resetGameForRosterChange();renderPlayers()}
function removePlayer(pid){game.players=game.players.filter(function(p){return p.id!==pid});resetGameForRosterChange();renderPlayers()}
function renderPlayers(){
  document.getElementById("players").innerHTML=game.players.map(function(p){
    return '<div class="player"><strong>'+esc(p.name)+
      '</strong><button class="danger" onclick="removePlayer(\''+p.id+'\')">Remove</button></div>';
  }).join("");
  updateResumeButton();
  updateSaveButton();
  updateBlankPdfButton();
}
function updateBlankPdfButton(){
  var button=document.getElementById("downloadBlankPdfButton");
  if(!button) return;
  button.classList.toggle("hidden", game.players.length===0);
}
function updateSaveButton(){
  var button=document.getElementById("saveButton");
  if(!button) return;
  button.classList.toggle("hidden", !game.started || game.players.length===0);
}
function saveGame(){
  // Saving is intentionally disabled.
  setStatus("Saving disabled.");
  console.debug && console.debug('cabbage: save attempted but disabled');
  var error=document.getElementById("error"); if(error) error.textContent="";
  setTimeout(clearStatus, 2200);
}
function downloadBlankScoreSheetPDF(){
  if(!game.players.length) return;
  var PdfConstructor = window.jspdf && window.jspdf.jsPDF ? window.jspdf.jsPDF : window.jsPDF ? window.jsPDF : null;
  if(!PdfConstructor){alert('PDF export is unavailable.');return;}
  var doc = new PdfConstructor({unit:'pt',format:'a4'});
  var margin = 36;
  var pageWidth = doc.internal.pageSize.getWidth();
  var availableWidth = pageWidth - margin * 2;
  var columns = game.players.length + 1;
  var colWidth = Math.max(60, Math.floor(availableWidth / columns));
  var rowHeight = 20;
  var y = margin;
  doc.setFontSize(18);
  doc.text('Cabbage Score Sheet', margin, y);
  y += 24;
  doc.setFontSize(11);
  doc.text('Players: ' + game.players.map(function(p){return p.name}).join(', '), margin, y);
  y += 18;
  doc.setFontSize(10);
  doc.text('Gold cells mark starter positions for each round.', margin, y);
  y += 22;
  var headerY = y;
  var x = margin;
  doc.setFillColor(220, 220, 220);
  doc.rect(x, headerY - 14, colWidth, rowHeight, 'F');
  doc.setTextColor(0, 0, 0);
  doc.text('Round', x + 4, headerY);
  for(var pi=0; pi<game.players.length; pi++){
    x = margin + colWidth * (pi + 1);
    doc.rect(x, headerY - 14, colWidth, rowHeight, 'F');
    var name = game.players[pi].name;
    doc.text(name, x + 4, headerY);
  }
  y += rowHeight;
  for(var ri=0; ri<rounds.length; ri++){
    x = margin;
    doc.rect(x, y - 14, colWidth, rowHeight, 'S');
    doc.text(rounds[ri], x + 4, y);
    for(var pi2=0; pi2<game.players.length; pi2++){
      x = margin + colWidth * (pi2 + 1);
      var starterIndex = (game.startPlayer + ri) % game.players.length;
      if(pi2 === starterIndex){
        doc.setFillColor(255, 212, 81);
        doc.rect(x, y - 14, colWidth, rowHeight, 'F');
        doc.setTextColor(0, 0, 0);
        doc.rect(x, y - 14, colWidth, rowHeight, 'S');
      } else {
        doc.setFillColor(255, 255, 255);
        doc.rect(x, y - 14, colWidth, rowHeight, 'F');
        doc.setTextColor(0, 0, 0);
        doc.rect(x, y - 14, colWidth, rowHeight, 'S');
      }
    }
    y += rowHeight;
    if(y + rowHeight > doc.internal.pageSize.getHeight() - margin){
      doc.addPage();
      y = margin;
    }
  }
  doc.save('cabbage-blank-score-sheet-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.pdf');
}
function updateResumeButton(){
  var button=document.getElementById("resumeButton");
  if(!button)return;
  var saved=null;
  try{saved=localStorage.getItem("cabbageTableCurrent")}catch(e){}
  button.classList.toggle("hidden",!saved||game.started);
  if(saved){
    try{
      var parsed=JSON.parse(saved);
      if(parsed&&parsed.startedAt){
        button.textContent="Resume Saved Game — "+getStartDateLabelFromSaved(parsed.startedAt);
      } else {
        button.textContent="Resume Saved Game";
      }
    }catch(e){button.textContent="Resume Saved Game";}
  }
  updateGameScreenButton();
}
function updateGameScreenButton(){
  var button=document.getElementById('gameScreenButton');
  if(!button) return;
  var saved=null;
  try{saved=localStorage.getItem('cabbageTableCurrent')}catch(e){}
  var hasSaved=false;
  if(saved){
    try{var parsed=JSON.parse(saved); hasSaved = !!(parsed && parsed.started);}catch(e){hasSaved=false;}
  }
  var enabled = (game.started && game.players && game.players.length>0) || hasSaved;
  button.disabled = !enabled;
  button.classList.toggle('disabled', !enabled);
}
function getStartDateLabelFromSaved(value){
  if(!value) return "";
  var d=new Date(value);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
}
function resumeGame(){
  var saved=null;
  try{saved=localStorage.getItem("cabbageTableCurrent")}catch(e){}
  if(!saved)return;
  try{
    game=JSON.parse(saved);
    console.debug && console.debug('cabbage: resumed', game && game.startedAt);
    if(!game.theme)game.theme="light";
    applyTheme();
    showGame();
    renderSavedGames();
    updateGameScreenButton();
    setStatus("Saved game loaded.");
    setTimeout(clearStatus, 2200);
  }catch(e){
    document.getElementById("error").textContent="The saved game could not be opened.";
  }
}
function chooseRandomStarter(){
  game.startPlayer=Math.floor(Math.random()*game.players.length);
}
function getStartDateLabel(){
  if(!game.startedAt) return "Unknown start";
  var d=new Date(game.startedAt);
  if(isNaN(d.getTime())) return "Unknown start";
  return d.toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
}
function startGame(){
  if(game.players.length<2){
    document.getElementById("error").textContent="Add at least two players.";
    return;
  }
  chooseRandomStarter();
  game.started=true;
  game.startedAt=new Date().toISOString();
  save();
  showGame();
}
function showGame(){document.getElementById("setup").classList.add("hidden");document.getElementById("game").classList.remove("hidden");renderTable();renderFinal();updateSaveButton();updateGameScreenButton();}
function k(pid,r){return pid+"|"+r}
function entry(pid,r){return game.entries[k(pid,r)]||null}
function total(pid){var t=0;for(var r=0;r<13;r++){var x=entry(pid,r);if(!x)continue;if(x.type==="full")t=0;else if(x.type==="score")t+=x.value}return t}

      if(x){if(x.type==="score")c=x.value;if(x.type==="cabbage")c='<span class="mark cabbage"></span>';if(x.type==="full")c='<span class="mark full"></span>'}

  var complete=game.players.length&&game.players.every(function(p){for(var r=0;r<13;r++)if(!entry(p.id,r))return false;return true});
  if(complete) game.showTotals=true;

  ps.forEach(function(p){

    h+='<td class="'+cls+'">'+(game.showTotals?'<span class="total-visible">'+total(p.id)+'</span>':'<span class="total-hidden">•••</span>')+"</td>";

function digit(n){modal.value=modal.value==="0"?n:(modal.value.length<4?modal.value+n:modal.value);showDisplay()}
function clearNum(){modal.value="0";showDisplay()}
function backspace(){modal.value=modal.value.slice(0,-1)||"0";showDisplay()}
function commit(x){var key=k(modal.playerId,modal.round);game.history.push({key:key,previous:game.entries[key]||null});game.entries[key]=x;save();closeModal();renderTable();renderFinal()}
function saveScore(){commit({type:"score",value:Number(modal.value)})}
function special(t){commit({type:t,value:0})}

function bindEye(){var b=document.getElementById("eye");if(!b||b.dataset.bound)return;b.dataset.bound="1";var timer;function show(){clearTimeout(timer);game.showTotals=true;renderTable()}function hide(){clearTimeout(timer);timer=setTimeout(function(){game.showTotals=false;renderTable()},800)}b.addEventListener("mousedown",show);b.addEventListener("mouseup",hide);b.addEventListener("mouseleave",hide);b.addEventListener("touchstart",function(e){e.preventDefault();show()},{passive:false});b.addEventListener("touchend",function(e){e.preventDefault();hide()},{passive:false});b.addEventListener("click",function(){show();hide()})}
function complete(){return game.players.every(function(p){for(var r=0;r<13;r++)if(!entry(p.id,r))return false;return true})}

  return pence>=100?"£"+(pence/100).toFixed(2):pence+"p";
}
function renderFinal(){var c=document.getElementById("final");var downloadButton=document.getElementById("downloadFinalButton");if(!complete()){c.classList.add("hidden");if(downloadButton)downloadButton.classList.add("hidden");return}c.classList.remove("hidden");if(downloadButton)downloadButton.classList.remove("hidden");var ps=game.players.slice().sort(function(a,b){return total(a.id)-total(b.id)}),low=total(ps[0].id),wins=ps.filter(function(p){return total(p.id)===low}),h="";if(wins.length===1){var w=wins[0];h="<h3>"+esc(w.name)+" wins with "+low+" points</h3>";ps.filter(function(p){return p.id!==w.id}).forEach(function(p){h+='<div class="settle"><span>'+esc(p.name)+" owes "+esc(w.name)+"</span><strong>"+formatOwed(total(p.id)-low)+"</strong></div>"})}else h="<p>Tied lowest score — no single-winner payment shown.</p>";document.getElementById("result").innerHTML=h}

ation failed, falling back to text.',e);} }var lines=[];lines.push(title);lines.push("Date: "+dateLabel);lines.push("");lines.push("Score Table:");for(var r2=0;r2<rounds.length;r2++){var row2=[rounds[r2]];ps.forEach(function(p){var x=entry(p.id,r2);row2.push(x? x.type==='score'?String(x.value):x.type==='cabbage'?'C':x.type==='full'?'F':'?':'-');});lines.push(row2.join(" | "));}lines.push("");lines.push("Totals:");ps.forEach(function(p,i){lines.push((i+1)+". "+p.name+" - "+total(p.id)+" points")});var wins2=ps.filter(function(p){return total(p.id)===low});if(wins2.length===1){var w2=wins2[0];lines.push("");lines.push("Winner: "+w2.name+" ("+low+" points)");lines.push("");lines.push("Settlements:");ps.filter(function(p){return p.id!==w2.id}).forEach(function(p){lines.push(p.name+" owes "+w2.name+" "+formatOwed(total(p.id)-low));});}else{lines.push("");lines.push("Tie for lowest score. No single-winner payment shown.");}var blob=new Blob([lines.join("\r\n")],{type:"text/plain;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fileName.replace(/\.pdf$/,'.txt');document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);} 
function save(){localStorage.setItem("cabbageTableCurrent",JSON.stringify(game))}
function load(){
  loadPreviousNames();
  renderSavedGames();
  var s=localStorage.getItem("cabbageTableCurrent");
  if(!s){applyTheme();updateResumeButton();updateGameScreenButton();return}
  try{
    var savedGame=JSON.parse(s);
    if(savedGame.started){
      game={players:[],entries:{},history:[],started:false,showTotals:false,theme:savedGame.theme||"dark"};
      applyTheme();
      updateResumeButton();
    }else{
      game=savedGame;
      if(!game.theme)game.theme="dark";
      applyTheme();
      renderPlayers();
      updateSaveButton();
    }
  }catch(e){
    applyTheme();
    updateResumeButton();
  }

function openNewGameModal(){
  document.getElementById("newGameBack").classList.remove("hidden");
}

function closeNewGameModal(){
  document.getElementById("newGameBack").classList.add("hidden");
}

function clearSavedGames(){
  try{
    localStorage.removeItem("cabbageTableCurrent");
    localStorage.removeItem("cabbageTableV8");
    localStorage.removeItem("cabbageTableV9");
    localStorage.removeItem("cabbageTableV10");
    localStorage.removeItem("cabbageTableV11");
    localStorage.removeItem("cabbageTableV12");
  }catch(error){
    console.warn("Saved game could not be removed.",error);
  }

function newGameSamePlayers(){

  game.entries={};
  game.history=[];
  game.started=true;
  game.showTotals=false;
  chooseRandomStarter();

  closeNewGameModal();
  save();
  renderTable();
  renderFinal();
  updateResumeButton();
  updateGameScreenButton();

  var currentTheme=game.theme||"dark";
  clearSavedGames();

  game={
    players:[],
    entries:{},
    history:[],
    started:false,
    showTotals:false,

// Allow hardware keyboard numeric entry when the modal is open
document.addEventListener('keydown', function(e){
  var backEl = document.getElementById('back');
  if(!backEl || backEl.classList.contains('hidden')) return;
  if(e.key >= '0' && e.key <= '9'){
    digit(e.key);
    e.preventDefault();
    return;
  }
  if(e.key === 'Enter'){
    saveScore();
    e.preventDefault();
    return;
  }
  if(e.key === 'Backspace'){
    backspace();
    e.preventDefault();
    return;
  }
  if(e.key === 'Escape'){
    closeModal();
    e.preventDefault();
    return;
  }
});

document.getElementById("name").addEventListener("keydown",function(e){if(e.key==="Enter")addPlayer()});
document.getElementById("back").addEventListener("click",function(e){
  if(e.target===this){
    saveScore();
  }
});
document.getElementById("newGameBack").addEventListener("click",function(e){if(e.target===this)closeNewGameModal()});
load();applyTheme();renderPlayers();
